services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: taskflow, POSTGRES_USER: taskflow, POSTGRES_PASSWORD: taskflow }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    env_file: ./backend/.env.example
    environment: { DB_URL: "jdbc:postgresql://db:5432/taskflow" }
    depends_on: [db]
    ports: ["8080:8080"]
  frontend:
    build: { context: ./frontend, args: { VITE_API_URL: "http://localhost:8080/api/v1" } }
    ports: ["5173:80"]
volumes: { pgdata: {} }
